name: Skill request
description: Suggest a new skill or an improvement to an existing one.
labels: [skill-request]
body:
  - type: textarea
    id: task
    attributes:
      label: What should the agent be able to do?
      description: The task, and the situations where the skill should kick in.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What goes wrong today without it?
  - type: textarea
    id: references
    attributes:
      label: References
      description: Docs, tools, or examples the skill should build on.
