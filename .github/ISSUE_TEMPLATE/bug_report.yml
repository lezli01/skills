name: Bug report
description: A skill misbehaves, fails to install, or gives wrong guidance.
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: skill-name
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Claude Code 2.x, Codex, Cursor, ...
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Install command, the prompt you gave, and any relevant output.
